name: Verify
on:
  push:
  pull_request:
jobs:
  package-and-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run example:install
      - run: npm --prefix example run check
      - run: npx expo export --platform ios --platform android
        working-directory: example
