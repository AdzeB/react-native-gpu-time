name: Publish to npm

on:
  release:
    types: [published]
  # Manual runs verify and pack; only a release can publish.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm 12
        run: npm install --global npm@12
      - name: Validate release version and choose npm tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.GITHUB_EVENT_NAME === 'release' && process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag must be v${version}; received ${process.env.RELEASE_TAG}`);
          }
          const tag = process.env.IS_PRERELEASE === 'true' || version.includes('-') ? 'next' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          NODE
      - run: npm ci
      - run: npm run verify
      - name: Pack the verified build
        id: package
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/npm-pack.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const [archive] = Object.values(JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'npm-pack.json'), 'utf8')));
          appendFileSync(process.env.GITHUB_OUTPUT, `path=${join(process.env.RUNNER_TEMP, archive.filename)}\n`);
          NODE
      - name: Check the publish payload
        if: github.event_name == 'release'
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          NPM_TAG: ${{ steps.release.outputs.tag }}
        run: npm publish "$PACKAGE_PATH" --dry-run --access public --tag "$NPM_TAG"
      - name: Publish through npm trusted publishing
        if: github.event_name == 'release'
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          NPM_TAG: ${{ steps.release.outputs.tag }}
        run: npm publish "$PACKAGE_PATH" --access public --tag "$NPM_TAG"
